name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7
          cache-disabled: true
      - name: Generate release keystore
        run: |
          cd android
          keytool -genkeypair -v -keystore release.keystore -alias twiga -keyalg RSA -keysize 2048 -validity 10000 -storepass twiga123 -keypass twiga123 -dname "CN=Twiga, OU=Dev, O=Twiga, L=Nairobi, ST=Nairobi, C=KE"
      - name: Build APK
        run: cd android && gradle assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

